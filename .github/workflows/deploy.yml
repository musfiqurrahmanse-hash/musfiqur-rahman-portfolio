name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and prerender portfolio
        run: bun run build

      - name: Prepare static site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if [ -f ".output/public/index.html" ]; then
            cp -a .output/public/. site/
          elif [ -f "dist/index.html" ]; then
            cp -a dist/. site/
          elif [ -f "dist/client/index.html" ]; then
            cp -a dist/client/. site/
          elif [ -f "build/client/index.html" ]; then
            cp -a build/client/. site/
          else
            echo "Could not find a prerendered index.html in the expected build output directories."
            echo "Inspect the build logs and update this workflow to match the actual static output."
            find .output dist build -maxdepth 3 -name index.html -print 2>/dev/null || true
            exit 1
          fi
          touch site/.nojekyll
          test -f site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
